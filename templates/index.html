<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Text to Speech</title>
  <link rel="stylesheet" href="/static/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/static/favicon.png">

</head>
<body>
  <div class="container">
    <div class="top-bar">
      <h1>Text to Speech</h1>
      <label class="theme-switch">
        <input type="checkbox" id="themeToggle">
        <span class="slider"></span>
      </label>
    </div>

    <textarea id="textInput" placeholder="Type your text here..."></textarea>

    <div class="controls">
      <label for="speedControl">Speed: <span id="speedValue">1.0</span>x</label>
      <input type="range" id="speedControl" min="0.5" max="1.5" step="0.1" value="1.0">
    </div>

    <button id="convertBtn">🔊 Convert to Speech</button>

    <audio id="audioPlayer" controls></audio>

    <a id="downloadLink" style="display:none" download="speech.mp3">⬇️ Download Speech</a>
  </div>

  <script src="/static/script.js"></script>
</body>

</html>
